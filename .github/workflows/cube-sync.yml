# Once a week, pull the One Piece cube list from TheVaus/OPTCG-Cube. A changed list becomes a new version on cube.html.
name: Sync cube list
on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/sync_cube.py
      - name: Commit a new version
        run: |
          if [ -n "$(git status --porcelain cube)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cube
            git commit -m "Cube: new card list version from TheVaus/OPTCG-Cube"
            git push
          fi
